<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio N14 — Variables CSS y Temas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="header">
    <h1>Ejercicio N14 — Variables CSS</h1>
    <p>Tema Claro / Oscuro </p>
  </header>

  <main class="container">
    <article class="card">
      <h2 class="card-title">Simulación de Modo Oscuro</h2>
      <p class="card-text">
        Al hacer clic en el botón de abajo, se conmuta la clase del body entre el modo claro y el modo oscuro.
      </p>
      
      <button id="theme-toggle" class="btn">Cambiar Modo</button>
    </article>
  </main>

  <script>
    // Script sencillo para alternar el modo oscuro cambiando la clase del body
    const btn = document.getElementById('theme-toggle');
    btn.addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
    });
  </script>

</body>
</html>
