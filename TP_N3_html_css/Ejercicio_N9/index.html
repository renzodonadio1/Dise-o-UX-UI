<!DOCTYPE html>

<head>

    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1>Ejercicio N9 — Flexbox: Galería de productos</h1>
    <header>
    <section class="gallery">

      <!-- Tarjeta 1 -->
      <article class="card">

          <h2 class="card-title">Producto 1</h2>
          <p class="card-price">$12.500</p>
          <button class="card-btn">Comprar</button>
