<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio N16 — Animaciones CSS</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="container">
    <!-- Spinner de Carga -->
    <div class="loader-container">
      <div class="spinner"></div>
      <p class="loading-text">Cargando contenido...</p>
    </div>

    <!-- Tarjeta animada -->
    <article class="animated-card">
      <h2>Tarjeta Animada</h2>
      <p>
        targeta con animacion de entrada (fade-in + slide-up)
      </p>
      <button class="card-btn">Aceptar</button>
    </article>
  </main>

</body>
</html>
