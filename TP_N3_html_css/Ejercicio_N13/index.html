<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio N13 — Formulario Estilizado</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="form-container">
    <h2>Reserva de Cancha / Contacto</h2>
    
    <form action="#" method="POST" class="styled-form">
      
      <!-- Campo Nombre -->
      <div class="form-group">
        <label for="nombre">Nombre Completo</label>
        <input type="text" id="nombre" name="nombre" placeholder="Ej: Renzo Donadío" required>
      </div>

      <!-- Campo Correo -->
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
      </div>

      <!-- Campo Menú Desplegable -->
      <div class="form-group">
        <label for="servicio">Servicio de Interés</label>
        <select id="servicio" name="servicio" required>
          <option value="" disabled selected>Selecciona una opción</option>
          <option value="cancha">Reserva de Cancha Deportiva</option>
          <option value="otro">Consulta General</option>
        </select>
      </div>

      <!-- Campo Mensaje -->
      <div class="form-group">
        <label for="mensaje">Mensaje o Detalles</label>
        <textarea id="mensaje" name="mensaje" rows="4" placeholder="Escribe tu mensaje aquí..."></textarea>
      </div>

      <!-- Botón de Envío -->
      <button type="submit" class="submit-btn">Enviar Solicitud</button>

    </form>
  </main>

</body>
</html>
