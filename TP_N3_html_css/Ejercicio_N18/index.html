<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio N18 — Galería Mosaico</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="gallery-container">
    <h2>Galería Mosaico (Masonry-like)</h2>
    <p>Distribución dinámica CSS Grid sin espacios vacíos.</p>

    <div class="gallery-grid">
      <!-- REQUISITO: Elemento destacado que ocupa 2 columnas y 2 filas -->
      <div class="gallery-item item-featured">
        <img src="../imagenes_ux-ui/logo_oso.png" alt="Oso destacado">
        <span class="tag">Destacado (2x2)</span>
      </div>

      <div class="gallery-item item-wide">
        <img src="../imagenes_ux-ui/logo_oso.png" alt="Oso ancho">
        <span class="tag">Ancho (2x1)</span>
      </div>

      <div class="gallery-item">
        <img src="../imagenes_ux-ui/logo_oso.png" alt="Oso normal">
        <span class="tag">Normal (1x1)</span>
      </div>

      <div class="gallery-item item-tall">
        <img src="../imagenes_ux-ui/logo_oso.png" alt="Oso alto">
        <span class="tag">Alto (1x2)</span>
      </div>

      <div class="gallery-item">
        <img src="../imagenes_ux-ui/logo_oso.png" alt="Oso normal">
        <span class="tag">Normal (1x1)</span>
      </div>

      <div class="gallery-item item-wide">
        <img src="../imagenes_ux-ui/logo_oso.png" alt="Oso ancho">
        <span class="tag">Ancho (2x1)</span>
      </div>

      <div class="gallery-item">
        <img src="../imagenes_ux-ui/logo_oso.png" alt="Oso normal">
        <span class="tag">Normal (1x1)</span>
      </div>

      <div class="gallery-item">
        <img src="../imagenes_ux-ui/logo_oso.png" alt="Oso normal">
        <span class="tag">Normal (1x1)</span>
      </div>
    </div>
  </main>

</body>
</html>
