<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio N12 — Posicionamiento</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Contenido con scroll para probar el botón fijo -->
  <main class="content">
    <h1>Ejercicio N12 — Posicionamiento CSS</h1>
    <p>Haz scroll hacia abajo para verificar la posición del botón flotante.</p>

    <!-- Contenedor del Tooltip -->
    <div class="tooltip-container">
      <button class="info-btn">Pasa el cursor aquí</button>
      <span class="tooltip-text">Tooltip flotante</span>
    </div>

    <!-- Relleno para generar barra de desplazamiento -->
    <div class="scroll-filler">
      <p>Desplázate hacia abajo...</p>
    </div>
  </main>

  <!-- Botón Volver Arriba -->
  <a href="#" class="back-to-top" title="Volver arriba">↑</a>

</body>
</html>
