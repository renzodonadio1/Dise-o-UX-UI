<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 4 — Formulario de Contacto</title>
</head>
<body>


    <h1>Ejercicio N4</h1>

    <h2>Formulario de Contacto</h2>

    <form action="#" method="post">
        <!-- Campo Nombre -->
        <div>
            <label for="nombre">Nombre completo:</label><br>
            <input type="text" id="nombre" name="nombre" required placeholder="Tu nombre y apellido">
        </div>
        <br>

        <!-- Campo Email -->
        <div>
            <label for="email">Correo electrónico:</label><br>
            <input type="email" id="email" name="email" required placeholder="ejemplo@correo.com">
        </div>
        <br>

        <!-- Campo Mensaje -->
        <div>
            <label for="mensaje">Mensaje:</label><br>
            <textarea id="mensaje" name="mensaje" rows="5" cols="40" required placeholder="Escribe tu mensaje aquí..."></textarea>
        </div>
        <br>

        <!-- Botón de Envío -->
        <button type="submit">Enviar mensaje</button>
    </form>

</body>
</html>
